[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zcode"
version = "0.4.3"
description = "Zcode 技能运行时适配层：profile 加载、LLM Provider 抽象、技能清单"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "textual",
]

[project.scripts]
zcode = "zcode.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zcode*"]

[tool.setuptools.package-data]
zcode = ["templates/ticket/**/*"]
