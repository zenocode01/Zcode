# 功能开发 MetaSkill：模型自由编排
# 与 workflows/feature-dev.yaml（确定性）对应，此版把编排权交给模型
name: feature-dev
description: 功能开发：在核心技能间自由编排（需求→设计→计划→实现→审查）
when: 用户要求开发新功能

skills:
  - grill-me
  - brainstorming
  - writing-plans
  - tdd
  - code-review

rules:
  - "grill-me 应在设计之前（先拷问需求再设计）"
  - "brainstorming 获得用户批准前，不得进入实现类步骤（硬门）"
  - "tdd 可对多个任务重复执行"
  - "code-review 在所有实现完成后执行"
  - "可用技能无法覆盖需求时，直接向用户说明，不要硬编"
