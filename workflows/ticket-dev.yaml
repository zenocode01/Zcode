# 工单驱动开发工作流：状态机纪律下完成一段工作
# 确定性线性模板（本地小模型模式）：模型只做每步决策，流程由 runner 驱动
name: ticket-dev
description: 工单驱动开发——在 zcode ticket 工作台项目中推进两个状态机（analyze→plan→implement→verify→review→commit），先看状态、按 next 拾取、逐步推进、resolve 后 close

steps:
  - skill: workbench
    prompt: "加载 workbench 技能：接手工单项目先跑 zcode ticket context（或读 STATUS.md）了解当前状态，绝不手动改锚点。"

  - command: "zcode ticket context"

  - command: "zcode ticket next"

  - prompt: "按以下循环推进（每个状态变更都用命令，不用编辑器改锚点）：
    1. 无进行中工单 → zcode ticket add \"<标题>\" 建工单，再 zcode ticket begin T-XXX 拾取
    2. analyze：更新 docs/CONTEXT.md 的 Domain:，新术语 zcode ticket gloss add
    3. zcode ticket phase plan → zcode ticket phase implement
    4. zcode ticket phase verify（配了 TestCommand 会真实执行；绿用 --green，红回 implement --red）
    5. zcode ticket transition T-XXX review
    6. zcode ticket resolve T-XXX \"根因+修复+验证\"（close 前必须）
    7. zcode ticket phase review --green → zcode ticket phase commit --pass
    8. git add + git commit（pre-commit hook 校验状态机）
    9. zcode ticket close T-XXX（自动合并分支、Phase 复位）
    遇到状态异常先 zcode ticket validate 查原因。"
