# 功能开发工作流：需求 → 设计 → 计划 → TDD 实现 → 审查
# 确定性线性模板（本地小模型模式）：模型只做每步决策，流程由 runner 驱动
name: feature-dev
description: 功能开发：grill-me 拷问需求 → brainstorming 设计 → writing-plans 计划 → tdd 实现 → code-review 审查

steps:
  - skill: grill-me
    prompt: "用 grill-me 拷问用户需求，挖出沉默假设，达成共识后再进入下一步。"

  - skill: brainstorming
    prompt: "按 brainstorming 流程产出设计并获用户批准（硬门：未批准不得写代码）。"

  - skill: writing-plans
    prompt: "把已批准的设计拆成 bite-sized 实现计划：文件结构 + 每任务带测试。"

  - skill: tdd
    prompt: "按计划逐个任务执行，每个任务走红绿重构循环。"

  - skill: code-review
    prompt: "实现完成后执行代码审查：分级反馈（Critical 立即修 / Important 修完再继续 / Minor 记下）。"
